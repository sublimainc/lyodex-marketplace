<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>LyoDex — Freeze-Drying Marketplace | Canada & USA</title>
    <meta name="description" content="LyoDex is a B2B marketplace connecting buyers with freeze-drying operators in Canada, the USA, and Europe. Submit RFQs, compare bids, and source freeze-dried ingredients and industrial freeze-dryers." />
    <meta name="keywords" content="freeze drying companies Canada, freeze drying companies USA, food freeze drying operators, freeze dried ingredient suppliers, industrial freeze dryer manufacturers, contract freeze drying food, B2B freeze dried ingredients, freeze drying marketplace" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://lyodex.com/" />
    <meta property="og:title" content="LyoDex — Freeze-Drying Marketplace | Canada & USA" />
    <meta property="og:description" content="B2B marketplace for freeze-drying services. Find operators, source freeze-dried ingredients, and discover industrial freeze-dryer manufacturers." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lyodex.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LyoDex — Freeze-Drying Marketplace" />
    <meta name="twitter:description" content="B2B marketplace for freeze-drying services. Find operators, source freeze-dried ingredients, and discover industrial freeze-dryer manufacturers." />
    <!--
      Entity definition.

      The important word below is "Organization", not "Manufacturer" or
      "FoodEstablishment". LyoDex operates no freeze-dryer and processes no
      material; it lists the companies that do. Describing it as a processor
      would rank it for neither role — an engine that catches an entity claiming
      to be something it is not stops treating it as a source for either.

      What LyoDex can legitimately claim, and what no competitor publishes, is
      the price data: observed rates per kilogram, sourced and dated. That is
      stated as a Dataset so it can be cited as one.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://lyodex.com/#organization",
          "name": "LyoDex",
          "url": "https://lyodex.com",
          "description": "Marketplace and directory connecting businesses that need freeze-drying with the operators who provide it, across Canada, the United States and Europe. LyoDex does not operate freeze-drying equipment.",
          "knowsAbout": [
            "Freeze-drying",
            "Lyophilisation",
            "Contract freeze-drying",
            "Food processing",
            "Freeze-dried ingredients",
            "Industrial freeze-dryers"
          ],
          "areaServed": [
            { "@type": "Country", "name": "Canada" },
            { "@type": "Country", "name": "United States" },
            { "@type": "Place", "name": "Europe" }
          ]
        },
        {
          "@type": "WebSite",
          "@id": "https://lyodex.com/#website",
          "name": "LyoDex",
          "url": "https://lyodex.com",
          "publisher": { "@id": "https://lyodex.com/#organization" },
          "inLanguage": ["en", "fr", "es"],
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://lyodex.com/operators?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Dataset",
          "@id": "https://lyodex.com/#price-benchmark",
          "name": "Freeze-dried product price benchmark",
          "description": "Retail prices per kilogram for finished freeze-dried products, read from the public catalogues of merchants across North America, Europe and Oceania. Each observation records its source URL and date. Prices without a published net weight are recorded without a price per kilogram rather than estimated.",
          "url": "https://lyodex.com/market-intelligence",
          "creator": { "@id": "https://lyodex.com/#organization" },
          "isAccessibleForFree": true,
          "measurementTechnique": "Direct observation of merchants' published catalogues",
          "variableMeasured": [
            { "@type": "PropertyValue", "name": "Price per kilogram", "unitCode": "KGM" },
            { "@type": "PropertyValue", "name": "Net weight", "unitCode": "GRM" }
          ]
        },
        {
          "@type": "Service",
          "@id": "https://lyodex.com/#rfq",
          "name": "Freeze-drying request for quote",
          "serviceType": "Contract freeze-drying sourcing",
          "provider": { "@id": "https://lyodex.com/#organization" },
          "description": "Post a freeze-drying requirement and receive quotes from listed operators. LyoDex connects the parties; the drying is performed by the independent operator.",
          "areaServed": [
            { "@type": "Country", "name": "Canada" },
            { "@type": "Country", "name": "United States" }
          ]
        }
      ]
    }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
