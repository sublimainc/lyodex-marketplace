kind = "mobile"
previewPath = "/lyodex-mobile/"
title = "LyoDex Mobile"
version = "1.0.0"
id = "artifacts/lyodex-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/lyodex-mobile/" ]
localPort = 22981

[services.development]
run = "pnpm --filter @workspace/lyodex-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lyodex-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/lyodex-mobile", "run", "serve" ]

[services.env]
PORT = "22981"
BASE_PATH = "/lyodex-mobile/"
